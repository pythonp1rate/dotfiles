# Force NVIDIA (card1) as primary DRM device
#env = WLR_DRM_DEVICES,/dev/dri/card1
#env = AQ_DRM_DEVICES,/dev/dri/by-path/pci-0000:01:00.0-card

# Workaround NVIDIA cursor bugs
env = WLR_NO_HARDWARE_CURSORS,1

env =  GBM_BACKEND,nvidia_drm
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia


# XDG
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# QT
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# Themes
env = GTK_THEME,catppuccin-macchiato-lavender-standard+default
env = XCURSOR_THEME,catppuccin-macchiato-dark-cursors
env = XCURSOR_SIZE,22
env = HYPRCURSOR_THEME,catppuccin-macchiato-dark-cursors
env = HYPRCURSOR_SIZE,22
