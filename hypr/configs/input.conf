input {
    kb_layout = se, 
    kb_variant = nodeadkeys 
    kb_model =pc105
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    numlock_by_default = true

    touchpad {
        natural_scroll = yes
        disable_while_typing = true
        scroll_factor = 1
    }
}

cursor {
    inactive_timeout = 3
}
