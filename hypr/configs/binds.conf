source = ~/.config/hypr/configs/default_apps.conf

# ========================
# VARIABLES
# ========================
$mainMod = SUPER
$scripts = ~/.config/hypr/scripts
$launcher-scripts = ~/.config/rofi/scripts

# ========================
# APPLICATIONS
# ========================
bind = $mainMod, RETURN, exec, $scripts/launch_app $terminal
bind = $mainMod, W, exec, $scripts/launch_app $browser
bind = $mainMod, E, exec, $scripts/launch_app $alter-file-manager
bind = $mainMod SHIFT, O, exec, $scripts/launch_app $office-suite
bind = $mainMod, I, exec, $scripts/launch_app $image-viewer
bind = $mainMod, K, exec, kitty

# ========================
# LAUNCHERS & MENUS
# ========================
bind = $mainMod, TAB, exec, $launcher
bind = $mainMod, ESCAPE, exec, $launcher-windows
bind = $mainMod, 61, exec, $launcher-scripts/keybindings/keybindings
bind = $mainMod, Y, exec, $launcher-scripts/clipboard/clipboard
bind = $mainMod CTRL, E, exec, $launcher-scripts/emoji/emoji
bind = $mainMod, P, exec, rofi-rbw --action=copy --clear-after 10
bind = $mainMod SHIFT, W, exec, $launcher-scripts/wallpaper/wallpaper
bind = ALT, ESCAPE, exec, $launcher-scripts/powermenu/powermenu
bind = ,148,exec,$launcher

# ========================
# WINDOW MANAGEMENT
# ========================
bind = $mainMod, Q, killactive,
bind = $mainMod, A, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, S, layoutmsg, togglesplit
bind = $mainMod, C, centerwindow,
bind = ALT, TAB, cyclenext,

# ========================
# MOUSE DRAGGING & RESIZING (FIXED)
# ========================
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# ========================
# WINDOW FOCUS / MOVEMENT
# ========================
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, backslash, exec, $scripts/window_move_by_rules

# ========================
# WINDOW RESIZING (FIXED SUBMAP)
# ========================
bind = $mainMod, R, submap, resize

submap = resize
binde = , left, resizeactive, -50 0
binde = , right, resizeactive, 50 0
binde = , up, resizeactive, 0 -50
binde = , down, resizeactive, 0 50
bind = , escape, submap, none
submap =

binde = $mainMod, left, resizeactive, -50 0
binde = $mainMod, right, resizeactive, 50 0
binde = $mainMod, up, resizeactive, 0 -50
binde = $mainMod, down, resizeactive, 0 50

binde = CTRL $mainMod, left, resizeactive, -10 0
binde = CTRL $mainMod, right, resizeactive, 10 0
binde = CTRL $mainMod, up, resizeactive, 0 -10
binde = CTRL $mainMod, down, resizeactive, 0 10

# ========================
# WORKSPACES
# ========================
# Smart per-monitor workspace switching
bind = $mainMod, 1, workspace, r~1
bind = $mainMod, 2, workspace, r~2
bind = $mainMod, 3, workspace, r~3
bind = $mainMod, 4, workspace, r~4
bind = $mainMod, 5, workspace, r~5
bind = $mainMod, 6, workspace, r~6
bind = $mainMod, 7, workspace, r~7
bind = $mainMod, 8, workspace, r~8
bind = $mainMod, 9, workspace, r~9

# Moving windows smartly per-monitor
bind = $mainMod SHIFT, 1, movetoworkspace, r~1
bind = $mainMod SHIFT, 2, movetoworkspace, r~2
bind = $mainMod SHIFT, 3, movetoworkspace, r~3
bind = $mainMod SHIFT, 4, movetoworkspace, r~4
bind = $mainMod SHIFT, 5, movetoworkspace, r~5
bind = $mainMod SHIFT, 6, movetoworkspace, r~6
bind = $mainMod SHIFT, 7, movetoworkspace, r~7
bind = $mainMod SHIFT, 8, movetoworkspace, r~8
bind = $mainMod SHIFT, 9, movetoworkspace, r~9

# Smart per-monitor cycling
bind = $mainMod CTRL, left, workspace, m-1
bind = $mainMod CTRL, right, workspace, m+1
bind = $mainMod CTRL, H, workspace, m-1
bind = $mainMod CTRL, L, workspace, m+1

# ========================
# MONITORS
# ========================
bind = $mainMod, comma, focusmonitor, l
bind = $mainMod, period, focusmonitor, r

# ========================
# BAR & NOTIFICATIONS
# ========================
bind = $mainMod, SPACE, exec, pkill -SIGUSR1 waybar
bind = $mainMod, T, exec, $bar-toggle
bind = $mainMod CTRL, R, exec, $bar-reload
bind = $mainMod, N, exec, $notifications-menu-toggle
bind = $mainMod SHIFT, N, exec, $notifications-menu-read
bind = $mainMod CTRL, N, exec, $notifications-menu-disturb

# ========================
# MEDIA CONTROLS
# ========================
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5

bind = $mainMod CTRL, RETURN, exec, playerctl play-pause
bind = $mainMod CTRL, KPADD, exec, playerctl next
bind = $mainMod CTRL, KPSUBTRACT, exec, playerctl previous
bind = $mainMod, KPADD, exec, pamixer -i 5
bind = $mainMod, KPSUBTRACT, exec, pamixer -d 5
bind = $mainMod SHIFT, KPADD, exec, pamixer --default-source -i 5
bind = $mainMod SHIFT, KPSUBTRACT, exec, pamixer --default-source -d 5

# ========================
# BRIGHTNESS (FIXED)
# ========================
bind = , XF86MonBrightnessUp, exec, brightnessctl -d amdgpu_bl1 set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl -d amdgpu_bl1 set 5%-

# ========================
# SCRATCHPADS (Pyprland)
# ========================
bind = $mainMod, V, exec, pypr toggle volume
bind = $mainMod, B, exec, pypr toggle bluetooth
bind = $mainMod, Z, exec, pypr toggle zoom

# ========================
# GROUPS
# ========================
bind = $mainMod, G, togglegroup
bind = $mainMod CTRL, G, lockgroups
bind = CTRL ALT, TAB, changegroupactive

# ========================
# SCREENSHOTS
# ========================
bind = $mainMod, X, exec, hyprshot -m output -o ~/Pictures/Screenshots
bind = $mainMod SHIFT, X, exec, grim -g "$(slurp -d)" - | tee ~/Pictures/Screenshots/$(date +'%F_%T').png | wl-copy
bind = $mainMod CTRL, X, exec, hyprshot -m window -o ~/Pictures/Screenshots

# ========================
# EXTRA
# ========================
bind = $mainMod, INSERT, exec, hyprpicker -a
bind = $mainMod, F10, exec, $bar-toggle
bind = $mainMod, F11, exec, $launcher-windows
bind = $mainMod, F12, exec, $launcher
bind = $mainMod SHIFT, ESCAPE, exec, hyprctl dispatch freezeactive

# ========================
# MONITOR SAFETY & MANUAL CONTROL
# ========================

# Force focus back to laptop screen
bind = $mainMod, F1, focusmonitor, eDP-1

# Enable external HDMI (manual, NVIDIA-safe)
bind = $mainMod, M, exec, ~/.config/wayscripts/enable-hdmi.sh

# Disable external HDMI cleanly
bind = $mainMod SHIFT, M, exec, ~/.config/wayscripts/disable-hdmi.sh
