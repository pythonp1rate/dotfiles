# =================================== #
# Opacity Rules (YOUR ORIGINAL)
# =================================== #

# --- Terminals ---
windowrule {
    name = opacity-kitty
    match:class = ^(kitty)$
    opacity = 0.70
    immediate = true
}
windowrule {
    name = opacity-alacritty
    match:class = ^(Alacritty)$
    opacity = 0.70
}
windowrule {
    name = opacity-ghostty
    match:class = ^(com.mitchellh.ghostty)$
    opacity = 0.70
    immediate = true
}

# --- Editors ---
windowrule {
    name = opacity-pycharm
    match:class = ^(jetbrains-pycharm)$
    opacity = 0.95
    immediate = true
}
windowrule {
    name = opacity-pycharm-alt
    match:class = ^(PyCharm)$
    opacity = 0.95
    immediate = true
}
# Cursor IDE (same as Discord 0.88)
windowrule {
    name = opacity-cursor
    match:class = ^([Cc]ursor)$
    opacity = 0.78
    immediate = true
}
windowrule {
    name = opacity-cursor-alt
    match:class = ^(.*[Cc]ursor.*)$
    opacity = 0.78
    immediate = true
}
# VSCode / VSCodium / Antigravity (same as Discord 0.88)
windowrule {
    name = opacity-code
    match:class = ^(Code)$
    opacity = 0.78
}
windowrule {
    name = opacity-vscodium
    match:class = ^(VSCodium)$
    opacity = 0.78
}
windowrule {
    name = opacity-antigravity
    match:class = ^(antigravity)$
    opacity = 0.78
    immediate = true
}
windowrule {
    name = opacity-antigravity-ide
    match:class = ^(antigravity-ide)$
    opacity = 0.78
    immediate = true
}

# --- Browsers (Firefox: no transparency for video) ---
# firefox uses default opacity

# --- Chat Apps / Extra (Discord: less transparent, no blur per-window in Hyprland) ---
windowrule {
    name = opacity-discord
    match:class = ^(discord)$
    opacity = 0.90
}

# --- Spotify (same as kitty 0.70) ---
windowrule {
    name = opacity-spotify
    match:class = ^(.*[Ss]potify.*)$
    opacity = 0.70
}

# --- Rofi (very transparent) ---
windowrule {
    name = opacity-rofi
    match:class = ^(rofi)$
    opacity = 0.38
}

# --- Neovim in terminal titles ---
windowrule {
    name = opacity-nvim
    match:title = ^(nvim.*)$
    opacity = 0.85
    immediate = true
}
windowrule {
    name = opacity-neovim
    match:title = ^(Neovim.*)$
    opacity = 0.85
    immediate = true
}

#wifi-manager
windowrule {
    name = opacity-wifi-manager
    match:class = ^(wifi-manager)$
    opacity = 0.38
    immediate = true
}
