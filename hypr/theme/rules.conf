# ===============================
# Center Float Rules
# ===============================
windowrulev2 = center, class:^(center-float)$
windowrulev2 = center, title:^(.*Open Folder.*|.*Open File.*|.*Save File.*|.*Save Folder.*|.*Save Image.*|.*Save As.*)$
windowrulev2 = float, class:^(center-float)$
windowrulev2 = float, title:^(.*Open Folder.*|.*Open File.*|.*Save File.*|.*Save Folder.*|.*Save Image.*|.*Save As.*)$
windowrulev2 = size 50% 50%, class:^(center-float)$
windowrulev2 = size 50% 50%, title:^(.*Open Folder.*|.*Open File.*|.*Save File.*|.*Save Folder.*|.*Save Image.*|.*Save As.*)$

# ===============================
# Mini Float Rules
# ===============================
windowrulev2 = center, class:^(center-float-mini)$
windowrulev2 = center, title:^(.*galculator.*|.*yt-dlp-gui.*|.*udiskie.*|.*Calculator.*)$
windowrulev2 = float, class:^(center-float-mini)$
windowrulev2 = float, title:^(.*galculator.*|.*yt-dlp-gui.*|.*udiskie.*|.*Calculator.*)$
windowrulev2 = size 30% 40%, class:^(center-float-mini)$
windowrulev2 = size 30% 40%, title:^(.*galculator.*|.*yt-dlp-gui.*|.*udiskie.*|.*Calculator.*)$

# ===============================
# Float Rules for System Dialogs
# ===============================
windowrulev2 = float, title:^(xfce-polkit|weave|branchdialog|nm-connection-editor|org.twosheds.wgki|override)$

# ===============================
# Animation Rules
# ===============================
windowrulev2 = animation slide, title:^(.*cava.*)$
windowrulev2 = animation popin, class:^(.*wleave.*)$

# ===============================
# Scratchpads
# ===============================

# scratchpad-large
windowrulev2 = float, class:^(scratchpad-large)$
windowrulev2 = center 1, class:^(scratchpad-large)$
windowrulev2 = size 70% 70%, class:^(scratchpad-large)$
windowrulev2 = animation slide, class:^(scratchpad-large)$
windowrulev2 = workspace special:scratchpad-large silent, class:^(scratchpad-large)$

# scratchpad
windowrulev2 = float, class:^(scratchpad)$
windowrulev2 = center 1, class:^(scratchpad)$
windowrulev2 = size 50% 50%, class:^(scratchpad)$
windowrulev2 = animation slide, class:^(scratchpad)$
windowrulev2 = workspace special:scratchpad silent, class:^(scratchpad)$

# scratchpad-mini
windowrulev2 = float, class:^(scratchpad-mini)$
windowrulev2 = center 1, class:^(scratchpad-mini)$
windowrulev2 = size 30% 40%, class:^(scratchpad-mini)$
windowrulev2 = animation slide, class:^(scratchpad-mini)$
windowrulev2 = workspace special:scratchpad-mini silent, class:^(scratchpad-mini)$

# sideScratchpad
windowrulev2 = workspace special:scratchpad silent, class:^(.*com.ghostty-bluetooth.*)$|(.*com.ghostty-volume.*)$
windowrulev2 = size 30% 90%, class:^(.*com.ghostty-bluetooth.*)$|(.*com.ghostty-volume.*)$
windowrulev2 = float, class:^(.*com.ghostty-bluetooth.*)$|(.*com.ghostty-volume.*)$
windowrulev2 = center 1, class:^(.*com.ghostty-bluetooth.*)$|(.*com.ghostty-volume.*)$

# ===============================
# Specific App Rules (YOUR ORIGINAL)
# ===============================

# videobridge
windowrulev2 = opacity 0.0 override 0.0 override, class:^(.*xwaylandvideobridge.*)$
windowrulev2 = noanim, class:^(.*xwaylandvideobridge.*)$
windowrulev2 = noblur, class:^(.*xwaylandvideobridge.*)$
windowrulev2 = noinitialfocus, class:^(.*xwaylandvideobridge.*)$
windowrulev2 = maxsize 1 1, class:^(.*xwaylandvideobridge.*)$

# zathura
windowrulev2 = float, class:^(.*zathura.*)$
windowrulev2 = size 35% 90%, class:^(.*zathura.*)$
windowrulev2 = center 1, class:^(.*zathura.*)$

# scrcpy
windowrulev2 = center 1, class:^(.*scrcpy.*)$
windowrulev2 = float, class:^(.*scrcpy.*)$

windowrulev2 = noinitialfocus, class:(.*[Ss]potify.*)|(.*tidal-hifi.*)$|(.*You[Tt]ube Music.*)|^(.*feishin.*)$
windowrulev2 = idleinhibit always, class:^(.*steam_app.*)$
windowrulev2 = idleinhibit focus, class:^(.*[Ss]potify.*)$|^(.*feishin.*)$
windowrulev2 = idleinhibit fullscreen, class:^(.*celluloid.*)$|^(.*mpv.*)$|^(.*vlc.*)$
windowrulev2 = idleinhibit fullscreen, class:^(.*LibreWolf.*)$|^(.*floorp.*)$|^(.*Brave.*)$|^(.*firefox.*)$
windowrulev2 = immediate, class:^(.*steam_app.*)$

