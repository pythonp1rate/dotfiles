# ===============================
# Center Float Rules
# ===============================
windowrule = center class:^(center-float)$
windowrule = center title:^(.*Open Folder.*|.*Open File.*|.*Save File.*|.*Save Folder.*|.*Save Image.*|.*Save As.*)$
windowrule = float class:^(center-float)$
windowrule = float title:^(.*Open Folder.*|.*Open File.*|.*Save File.*|.*Save Folder.*|.*Save Image.*|.*Save As.*)$
windowrule = size 50% 50% class:^(center-float)$
windowrule = size 50% 50% title:^(.*Open Folder.*|.*Open File.*|.*Save File.*|.*Save Folder.*|.*Save Image.*|.*Save As.*)$

# ===============================
# Mini Float Rules
# ===============================
windowrule = center class:^(center-float-mini)$
windowrule = center title:^(.*galculator.*|.*yt-dlp-gui.*|.*udiskie.*|.*Calculator.*)$
windowrule = float class:^(center-float-mini)$
windowrule = float title:^(.*galculator.*|.*yt-dlp-gui.*|.*udiskie.*|.*Calculator.*)$
windowrule = size 30% 40% class:^(center-float-mini)$
windowrule = size 30% 40% title:^(.*galculator.*|.*yt-dlp-gui.*|.*udiskie.*|.*Calculator.*)$

# ===============================
# Float Rules for System Dialogs
# ===============================
windowrule = float title:^(xfce-polkit|weave|branchdialog|nm-connection-editor|org.twosheds.wgki|override)$

# ===============================
# Animation Rules
# ===============================
# windowrule = animation slide title:^(.*cava.*)$
# windowrule = animation popin class:^(.*wleave.*)$

# ===============================
# Scratchpads
# ===============================

# scratchpad-large
windowrule = float class:^(scratchpad-large)$
windowrule = center class:^(scratchpad-large)$
windowrule = size 70% 70% class:^(scratchpad-large)$
# windowrule = animation slide class:^(scratchpad-large)$
# windowrule = workspace special:scratchpad-large silent class:^(scratchpad-large)$

# scratchpad
windowrule = float class:^(scratchpad)$
windowrule = center class:^(scratchpad)$
windowrule = size 50% 50% class:^(scratchpad)$
# windowrule = animation slide class:^(scratchpad)$
# windowrule = workspace special:scratchpad silent class:^(scratchpad)$

# scratchpad-mini
windowrule = float class:^(scratchpad-mini)$
windowrule = center class:^(scratchpad-mini)$
windowrule = size 30% 40% class:^(scratchpad-mini)$
# windowrule = animation slide class:^(scratchpad-mini)$
# windowrule = workspace special:scratchpad-mini silent class:^(scratchpad-mini)$

# sideScratchpad
# windowrule = workspace special:scratchpad silent class:^(.*com.ghostty-bluetooth.*)$|(.*com.ghostty-volume.*)$
windowrule = size 30% 90% class:^(.*com.ghostty-bluetooth.*)$|(.*com.ghostty-volume.*)$
windowrule = float class:^(.*com.ghostty-bluetooth.*)$|(.*com.ghostty-volume.*)$
windowrule = center class:^(.*com.ghostty-bluetooth.*)$|(.*com.ghostty-volume.*)$

# ===============================
# Specific App Rules (YOUR ORIGINAL)
# ===============================
# videobridge
windowrule = opacity 0.0 override 0.0 override class:^(.*xwaylandvideobridge.*)$
# windowrule = noanim class:^(.*xwaylandvideobridge.*)$
# windowrule = noblur class:^(.*xwaylandvideobridge.*)$
# windowrule = noinitialfocus class:^(.*xwaylandvideobridge.*)$
# windowrule = maxsize 1 1 class:^(.*xwaylandvideobridge.*)$

# zathura
windowrule = float class:^(.*zathura.*)$
windowrule = size 35% 90% class:^(.*zathura.*)$
windowrule = center class:^(.*zathura.*)$

# scrcpy
windowrule = center class:^(.*scrcpy.*)$
windowrule = float class:^(.*scrcpy.*)$
windowrule = immediate class:^(.*steam_app.*)$

# =================================== #
# Opacity Rules (YOUR ORIGINAL)
# =================================== #

# --- Terminals ---
windowrule = opacity 0.70 class:^(kitty)$
windowrule = opacity 0.70 class:^(Alacritty)$
windowrule = opacity 0.70 class:^(com.mitchellh.ghostty)$
windowrule = immediate class:^(kitty)$
windowrule = immediate class:^(com.mitchellh.ghostty)$

 --- Editors ---
windowrule = opacity 0.95 class:^(jetbrains-pycharm)$
windowrule = opacity 0.95 class:^(PyCharm)$
windowrule = opacity 0.90 class:^(Code)$
windowrule = opacity 0.90 class:^(VSCodium)$
windowrule = immediate class:^(jetbrains-pycharm)$
windowrule = immediate class:^(PyCharm)$

# --- Browsers ---
windowrule = opacity 0.90 class:^(firefox)$

# --- Chat Apps / Extra ---
windowrule = opacity 0.70 class:^(discord)$

# --- Neovim in terminal titles ---
windowrule = opacity 0.85 title:^(nvim.*)$
windowrule = opacity 0.85 title:^(Neovim.*)$
windowrule = immediate title:^(nvim.*)$
windowrule = immediate title:^(Neovim.*)$

