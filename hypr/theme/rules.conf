# ===============================
# Center Float Rules
# ===============================
windowrule = center class:^(center-float)$
windowrule = center title:^(.*Open Folder.*|.*Open File.*|.*Save File.*|.*Save Folder.*|.*Save Image.*|.*Save As.*)$
windowrule = float class:^(center-float)$
windowrule = float title:^(.*Open Folder.*|.*Open File.*|.*Save File.*|.*Save Folder.*|.*Save Image.*|.*Save As.*)$
windowrule = size 50% 50% class:^(center-float)$
windowrule = size 50% 50% title:^(.*Open Folder.*|.*Open File.*|.*Save File.*|.*Save Folder.*|.*Save Image.*|.*Save As.*)$

# ===============================
# Mini Float Rules
# ===============================
windowrule = center class:^(center-float-mini)$
windowrule = center title:^(.*galculator.*|.*yt-dlp-gui.*|.*udiskie.*|.*Calculator.*)$
windowrule = float class:^(center-float-mini)$
windowrule = float title:^(.*galculator.*|.*yt-dlp-gui.*|.*udiskie.*|.*Calculator.*)$
windowrule = size 30% 40% class:^(center-float-mini)$
windowrule = size 30% 40% title:^(.*galculator.*|.*yt-dlp-gui.*|.*udiskie.*|.*Calculator.*)$

# ===============================
# Float Rules for System Dialogs
# ===============================
windowrule = float title:^(xfce-polkit|weave|branchdialog|nm-connection-editor|org.twosheds.wgki|override)$

# ===============================
# iwgtk – same transparency as control center (colors unchanged)
# ===============================
windowrule = float class:^(org\.twosheds\.iwgtk)$
windowrule = center class:^(org\.twosheds\.iwgtk)$
windowrule {
    name = opacity-iwgtk
    match:class = ^(org\.twosheds\.iwgtk)$
    opacity = 0.68
}

# ===============================
# Pavucontrol – small panel under topbar, top-right
# ===============================
windowrule = float class:^([Pp]avucontrol|org\.pulseaudio\.pavucontrol)$
windowrule = size 420 500 class:^([Pp]avucontrol|org\.pulseaudio\.pavucontrol)$
windowrule = move 100%-440 45 class:^([Pp]avucontrol|org\.pulseaudio\.pavucontrol)$
windowrule {
    name = opacity-pavucontrol
    match:class = ^([Pp]avucontrol|org\.pulseaudio\.pavucontrol)$
    opacity = 0.68
}

