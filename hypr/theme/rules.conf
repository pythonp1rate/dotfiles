# =================================== #
# Opacity Rules (YOUR ORIGINAL)
# =================================== #

# --- Terminals ---
windowrulev2 = opacity 0.70, class:^(kitty)$
windowrulev2 = opacity 0.70, class:^(Alacritty)$
windowrulev2 = opacity 0.70, class:^(com.mitchellh.ghostty)$
windowrulev2 = immediate, class:^(kitty)$
windowrulev2 = immediate, class:^(com.mitchellh.ghostty)$

# --- Editors ---
windowrulev2 = opacity 0.95, class:^(jetbrains-pycharm)$
windowrulev2 = opacity 0.95, class:^(PyCharm)$
windowrulev2 = opacity 0.90, class:^(Code)$
windowrulev2 = opacity 0.90, class:^(VSCodium)$
windowrulev2 = immediate, class:^(jetbrains-pycharm)$
windowrulev2 = immediate, class:^(PyCharm)$

# --- Browsers ---
windowrulev2 = opacity 0.90, class:^(firefox)$

# --- Chat Apps / Extra ---
windowrulev2 = opacity 0.70, class:^(discord)$

# --- Neovim in terminal titles ---
windowrulev2 = opacity 0.85, title:^(nvim.*)$
windowrulev2 = opacity 0.85, title:^(Neovim.*)$
windowrulev2 = immediate, title:^(nvim.*)$
windowrulev2 = immediate, title:^(Neovim.*)$

# --- Global stability patch ---
windowrulev2 = noanim, class:^(firefox)$
windowrulev2 = noanim, class:^(jetbrains-pycharm)$
windowrulev2 = noanim, class:^(com.mitchellh.ghostty)$
windowrulev2 = noanim, title:^(nvim.*)$
