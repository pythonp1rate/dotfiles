# ===============================
# Scratchpads
# ===============================

# scratchpad-large
windowrule = float class:^(scratchpad-large)$
windowrule = center class:^(scratchpad-large)$
windowrule = size 70% 70% class:^(scratchpad-large)$
# windowrule = animation slide class:^(scratchpad-large)$
# windowrule = workspace special:scratchpad-large silent class:^(scratchpad-large)$

# scratchpad
windowrule = float class:^(scratchpad)$
windowrule = center class:^(scratchpad)$
windowrule = size 50% 50% class:^(scratchpad)$
# windowrule = animation slide class:^(scratchpad)$
# windowrule = workspace special:scratchpad silent class:^(scratchpad)$

# scratchpad-mini
windowrule = float class:^(scratchpad-mini)$
windowrule = center class:^(scratchpad-mini)$
windowrule = size 30% 40% class:^(scratchpad-mini)$
# windowrule = animation slide class:^(scratchpad-mini)$
# windowrule = workspace special:scratchpad-mini silent class:^(scratchpad-mini)$

# sideScratchpad
# windowrule = workspace special:scratchpad silent class:^(.*com.ghostty-bluetooth.*)$|(.*com.ghostty-volume.*)$
windowrule = size 30% 90% class:^(.*com.ghostty-bluetooth.*)$|(.*com.ghostty-volume.*)$
windowrule = float class:^(.*com.ghostty-bluetooth.*)$|(.*com.ghostty-volume.*)$
windowrule = center class:^(.*com.ghostty-bluetooth.*)$|(.*com.ghostty-volume.*)$

